<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egzaminator PRO - Zakłady</title>
    
    <!-- Import czcionki i ikon -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1d2b4a, #1a1c1e);
            --card-bg: rgba(44, 47, 51, 0.6);
            --primary-color: #00ff89;
            --primary-gradient: linear-gradient(90deg, #00ff89, #00c2a9);
            --secondary-color: #ffc400; /* Złoty akcent na kursy */
            --text-color: #f0f0f0;
            --text-muted: #a0a0b0;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #28a745;
            --error-color: #dc3545;
            --font-family: 'Poppins', sans-serif;
        }

        /* --- GLOBALNE STYLE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-color);
            padding: 20px;
            min-height: 100vh;
        }

        /* --- NAGŁÓWEK --- */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 3em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 255, 137, 0.3);
        }
        
        header p {
            color: var(--text-muted);
            font-size: 1.1em;
            font-weight: 300;
        }

        /* --- GŁÓWNY KONTENER --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- LISTA ZAKŁADÓW I KARTY --- */
        .betting-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        @keyframes card-enter {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .person-card {
            background: var(--card-bg);
            border-radius: 15px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: card-enter 0.5s ease-out forwards;
            opacity: 0;
        }

        .person-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        .card-header {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }

        .person-name {
            font-size: 1.7em;
            font-weight: 600;
        }

        .card-body { padding: 25px; }

        .odds-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            text-align: center;
        }

        .odd-label {
            font-size: 0.9em;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .odd-value {
            font-size: 2.5em;
            font-weight: 700;
            color: var(--secondary-color);
            text-shadow: 0 0 10px rgba(255, 196, 0, 0.4);
        }

        .bet-buttons { display: flex; gap: 15px; }

        .bet-button {
            flex-grow: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #1a1c1e;
            text-transform: uppercase;
        }

        .bet-button:active { transform: scale(0.97); }

        .bet-button.yes { background: var(--primary-gradient); }
        .bet-button.yes:hover { box-shadow: 0 0 15px var(--primary-color); }

        .bet-button.no { background: linear-gradient(90deg, #ff5f6d, #ffc371); }
        .bet-button.no:hover { box-shadow: 0 0 15px #ff5f6d; }
        
        .total-pool {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9em;
            color: var(--text-muted);
            font-weight: 300;
        }

        /* --- PANEL ADMINA --- */
        #admin-panel {
            display: none;
            background: var(--card-bg);
            padding: 30px;
            margin: 60px auto;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            max-width: 500px;
            backdrop-filter: blur(10px);
        }
        
        #admin-panel h2 { text-align: center; margin-bottom: 25px; font-weight: 600; }
        .admin-form { display: flex; gap: 10px; }

        .admin-input {
            flex-grow: 1; padding: 12px; border: 1px solid var(--border-color);
            background-color: rgba(0,0,0,0.2); color: var(--text-color);
            border-radius: 8px; font-size: 1em; font-family: var(--font-family);
        }

        .admin-button {
            padding: 12px 20px; border: none; background: var(--primary-gradient);
            color: #1a1c1e; border-radius: 8px; cursor: pointer;
            font-size: 1em; font-weight: 600; transition: box-shadow 0.2s ease;
        }
        .admin-button:hover { box-shadow: 0 0 15px var(--primary-color); }
        .admin-button i { margin-right: 8px; }

        /* --- LOADER --- */
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .loader-spinner {
            border: 5px solid var(--border-color);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- OKNO MODALNE DO OBSTAWIANIA --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center;
            align-items: center; z-index: 999;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.visible { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 30px; border-radius: 15px;
            border: 1px solid var(--border-color);
            width: 90%; max-width: 400px; text-align: center;
            transform: scale(0.9); transition: transform 0.3s ease;
        }
        .modal-overlay.visible .modal { transform: scale(1); }
        .modal h3 { font-size: 1.5em; margin-bottom: 10px; }
        .modal p { color: var(--text-muted); margin-bottom: 20px; }
        .modal-input {
            width: 100%; padding: 15px; font-size: 1.2em; text-align: center;
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-color);
            color: var(--text-color); border-radius: 8px; margin-bottom: 20px;
            font-family: var(--font-family);
        }
        .modal-actions { display: flex; gap: 15px; }

        /* --- POWIADOMIENIA "TOAST" --- */
        #toast-container {
            position: fixed; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 1001;
        }
        .toast {
            padding: 15px 25px; border-radius: 8px;
            color: white; font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: toast-in 0.3s ease, toast-out 0.3s ease 3.7s forwards;
        }
        .toast.success { background: var(--success-color); }
        .toast.error { background: var(--error-color); }
        @keyframes toast-in { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toast-out { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <h1>Egzaminator PRO</h1>
        <p>Obstawiaj wyniki egzaminów w wielkim stylu.</p>
    </header>

    <main class="container">
        <div id="betting-list" class="betting-list"></div>
    </main>

    <!-- LOADER -->
    <div id="loader-overlay">
        <div class="loader-spinner"></div>
    </div>
    
    <!-- PANEL ADMINA -->
    <div id="admin-panel">
        <h2><i class="fas fa-user-shield"></i> Panel Administratora</h2>
        <div class="admin-form">
            <input type="text" id="new-person-name" class="admin-input" placeholder="Imię i nazwisko">
            <button id="add-person-button" class="admin-button"><i class="fas fa-plus"></i>Dodaj</button>
        </div>
    </div>

    <!-- OKNO MODALNE DO OBSTAWIANIA -->
    <div id="bet-modal-overlay" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Obstaw zakład</h3>
            <p id="modal-subtitle">Wpisz kwotę, którą chcesz postawić.</p>
            <input type="number" id="modal-bet-amount" class="modal-input" placeholder="0" min="1">
            <div class="modal-actions">
                <button id="modal-cancel" class="bet-button no" style="flex-grow: 0.5;">Anuluj</button>
                <button id="modal-confirm" class="bet-button yes">Zatwierdź</button>
            </div>
        </div>
    </div>

    <!-- KONTENER NA POWIADOMIENIA -->
    <div id="toast-container"></div>


    <script>
        // --- KONFIGURACJA (UZUPEŁNIJ!) ---
        const config = {
            API_URL: 'https://api.jsonbin.io/v3/b/684726828a456b7966ab6bc7',
            API_KEY: '$2a$10$T3nkKRACm80x5BL9/RR/D.btKlIEXaG6NDod8aDskPkob2OuszNrO', 
            ADMIN_KEY: 'ronim'
        };
        
        // --- STAN APLIKACJI ---
        let state = { people: [] };
        let currentBet = { personId: null, outcome: null }; // Przechowuje info dla modala

        // --- GŁÓWNE ELEMENTY DOM ---
        const bettingList = document.getElementById('betting-list');
        const loaderOverlay = document.getElementById('loader-overlay');
        const adminPanel = document.getElementById('admin-panel');
        const modalOverlay = document.getElementById('bet-modal-overlay');
        const toastContainer = document.getElementById('toast-container');

        // --- FUNKCJE POMOCNICZE ---
        const showLoader = () => loaderOverlay.style.display = 'flex';
        const hideLoader = () => loaderOverlay.style.display = 'none';

        /**
         * Pokazuje powiadomienie "toast"
         */
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-times-circle'}"></i> ${message}`;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        /**
         * Pobiera dane z JSONBin
         */
        async function fetchData() {
            if (!config.API_URL.includes('https://api.jsonbin.io') || !config.API_KEY.includes('$2a$10')) {
                hideLoader();
                bettingList.innerHTML = '<p style="text-align:center; color: var(--error-color); font-size: 1.2em;">Aplikacja nie jest skonfigurowana! Uzupełnij API_URL i API_KEY w kodzie.</p>';
                return;
            }

            try {
                const response = await fetch(config.API_URL + '/latest', {
                    headers: { 'X-Master-Key': config.API_KEY }
                });
                if (!response.ok) throw new Error(`Błąd sieci: ${response.status}`);
                const data = await response.json();
                state = data.record || { people: [] };
            } catch (error) {
                console.error('Nie udało się pobrać danych:', error);
                showToast('Błąd pobierania danych!', 'error');
            } finally {
                hideLoader();
                render();
            }
        }

        /**
         * Zapisuje dane w JSONBin
         */
        async function saveData() {
            showLoader();
            try {
                await fetch(config.API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': config.API_KEY
                    },
                    body: JSON.stringify(state)
                });
            } catch (error) {
                console.error('Nie udało się zapisać danych:', error);
                showToast('Błąd zapisu danych!', 'error');
            } finally {
                hideLoader();
            }
        }
        
        /**
         * Oblicza kursy
         */
        function calculateOdds(person) {
            const totalYes = person.bets.yes || 1;
            const totalNo = person.bets.no || 1;
            const totalPool = totalYes + totalNo;
            const margin = 0.90;

            const formatOdd = (odd) => Math.max(1.05, odd).toFixed(2);

            return {
                yes: formatOdd((totalPool / totalYes) * margin),
                no: formatOdd((totalPool / totalNo) * margin)
            };
        }

        /**
         * Renderuje listę osób
         */
        function render() {
            bettingList.innerHTML = '';
            if (state.people.length === 0) {
                bettingList.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Admin nie dodał jeszcze żadnych osób do obstawiania.</p>';
                return;
            }

            state.people.forEach((person, index) => {
                const odds = calculateOdds(person);
                const totalPersonPool = (person.bets.yes || 0) + (person.bets.no || 0);

                const card = document.createElement('div');
                card.className = 'person-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.innerHTML = `
                    <div class="card-header"><div class="person-name">${person.name}</div></div>
                    <div class="card-body">
                        <div class="odds-container">
                            <div>
                                <div class="odd-label">ZDA</div>
                                <div class="odd-value">${odds.yes}</div>
                            </div>
                            <div>
                                <div class="odd-label">NIE ZDA</div>
                                <div class="odd-value">${odds.no}</div>
                            </div>
                        </div>
                        <div class="bet-buttons">
                            <button class="bet-button yes" data-id="${person.id}" data-outcome="yes">Obstaw "ZDA"</button>
                            <button class="bet-button no" data-id="${person.id}" data-outcome="no">Obstaw "NIE ZDA"</button>
                        </div>
                        <div class="total-pool">Łączna pula: ${totalPersonPool} PLN</div>
                    </div>`;
                bettingList.appendChild(card);
            });
        }
        
        /**
         * Pokazuje okno modalne do obstawiania
         */
        function showBetModal(personId, outcome) {
            const person = state.people.find(p => p.id === personId);
            if (!person) return;
            
            currentBet = { personId, outcome };

            document.getElementById('modal-title').innerText = `Obstawiasz: ${person.name}`;
            document.getElementById('modal-subtitle').innerText = `Wynik: ${outcome === 'yes' ? 'ZDA' : 'NIE ZDA'}`;
            document.getElementById('modal-bet-amount').value = '';
            modalOverlay.classList.add('visible');
            document.getElementById('modal-bet-amount').focus();
        }

        /**
         * Ukrywa okno modalne
         */
        function hideBetModal() {
            modalOverlay.classList.remove('visible');
        }

        /**
         * Przetwarza zakład po potwierdzeniu w modalu
         */
        async function confirmBet() {
            const { personId, outcome } = currentBet;
            const amountInput = document.getElementById('modal-bet-amount');
            const amount = parseInt(amountInput.value, 10);

            if (isNaN(amount) || amount <= 0) {
                showToast("Podaj poprawną, dodatnią kwotę.", 'error');
                return;
            }
            
            const person = state.people.find(p => p.id === personId);
            if (person) {
                person.bets[outcome] += amount;
                hideBetModal();
                await saveData();
                showToast(`Postawiono ${amount} PLN!`, 'success');
                render(); // Przerenderuj, aby zaktualizować kursy
            }
        }
        
        /**
         * Dodaje nową osobę (funkcja admina)
         */
        async function addPerson() {
            const nameInput = document.getElementById('new-person-name');
            const name = nameInput.value.trim();
            if (!name) {
                showToast("Podaj imię i nazwisko.", 'error');
                return;
            }
            state.people.push({
                id: Date.now(),
                name: name,
                bets: { yes: 0, no: 0 }
            });
            await saveData();
            showToast(`Dodano "${name}" do listy!`, 'success');
            render();
            nameInput.value = '';
        }

        /**
         * Sprawdza dostęp admina
         */
        function checkAdminAccess() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === config.ADMIN_KEY) {
                adminPanel.style.display = 'block';
            }
        }

        // --- INICJALIZACJA I NASŁUCHIWANIE ZDARZEŃ ---
        document.addEventListener('DOMContentLoaded', () => {
            checkAdminAccess();
            fetchData();
            
            // Kliknięcia na przyciski obstawiania
            bettingList.addEventListener('click', (e) => {
                if (e.target.matches('.bet-button')) {
                    const personId = parseInt(e.target.dataset.id, 10);
                    const outcome = e.target.dataset.outcome;
                    showBetModal(personId, outcome);
                }
            });

            // Akcje w panelu admina
            document.getElementById('add-person-button').addEventListener('click', addPerson);
            document.getElementById('new-person-name').addEventListener('keyup', (e) => {
                if (e.key === 'Enter') addPerson();
            });

            // Akcje w oknie modalnym
            document.getElementById('modal-confirm').addEventListener('click', confirmBet);
            document.getElementById('modal-cancel').addEventListener('click', hideBetModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) hideBetModal();
            });
        });
    </script>
</body>
</html>
