<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RonimSTS</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #10121b;
            --card-bg: rgba(31, 34, 46, 0.6);
            --primary-color: #00e0a0;
            --secondary-color: #ffc82c;
            --text-color: #e8e8e8;
            --text-muted: #9a9fab;
            --border-color: rgba(255, 255, 255, 0.08);
            --error-color: #ff5252;
            --font-family: 'Poppins', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            padding: clamp(1rem, 3vw, 2rem);
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: clamp(2rem, 5vw, 4rem); }
        .user-profile { display: flex; align-items: center; justify-content: flex-end; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .user-info, .wallet-display { background: var(--card-bg); padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border-color); font-weight: 600; font-size: clamp(0.9rem, 2.5vw, 1.1rem); backdrop-filter: blur(8px); }
        .user-info i { color: var(--primary-color); margin-right: 8px;}
        .wallet-display i { color: var(--secondary-color); margin-right: 8px; }
        header h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; background: linear-gradient(90deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(255, 200, 44, 0.15); }
        
        .section-header { text-align: center; font-size: 1.8rem; margin-bottom: 25px; color: var(--text-muted); font-weight: 600; }
        
        .featured-bets { margin-bottom: 50px; }
        .featured-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .featured-card { background: linear-gradient(145deg, rgba(40, 43, 54, 0.8), rgba(31, 34, 46, 0.8)); padding: 25px; border-radius: 16px; border: 1px solid var(--border-color); transition: all 0.3s ease; position: relative; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .featured-card:before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background-image: conic-gradient(transparent, var(--glow-color, rgba(255,255,255,0.2)), transparent 30%); animation: rotate 4s linear infinite; }
        .featured-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
        .featured-content { position: relative; z-index: 2; }
        .featured-title { font-weight: 600; font-size: 1.1em; color: var(--text-muted); display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .featured-title .icon { font-size: 1.2em; color: var(--glow-color); }
        .featured-person { font-size: 1.5em; font-weight: 700; color: var(--text-color); margin-bottom: 5px; }
        .featured-details { font-size: 1em; color: var(--text-color); }
        
        .betting-list { display: grid; grid-template-columns: 1fr; gap: clamp(1.5rem, 3vw, 2.5rem); }
        .person-card { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border-color); backdrop-filter: blur(12px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25); overflow: hidden; transition: all 0.3s ease; animation: card-enter 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; opacity: 0; position: relative; }
        .card-header { padding: 25px; text-align: center; background: rgba(0,0,0,0.15); }
        .person-name { font-size: 2em; font-weight: 700; }
        .card-body { padding: 25px; }
        .bet-layout { display: flex; gap: 25px; }
        .main-bets-column { flex: 1; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid var(--border-color); padding-right: 25px; }
        .detailed-bets-column { flex: 1.5; }
        .column-header { font-size: 1.1em; font-weight: 600; color: var(--text-muted); margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .column-header i { margin-right: 8px; color: var(--primary-color); }
        .main-bet-option { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 20px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; transition: background-color 0.2s; }
        .bet-table { width: 100%; border-collapse: collapse; }
        .bet-label { font-weight: 600; }
        .bet-odd-value { font-weight: 700; font-size: 1.4em; color: var(--secondary-color); text-align: center;}
        .bet-button { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 0.9em; font-weight: 700; cursor: pointer; transition: all 0.2s ease; background: var(--primary-color); color: #10121b; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-footer { padding: 25px; border-top: 1px solid var(--border-color); background: rgba(0,0,0,0.1); }
        .bet-progress-bar { height: 14px; display: flex; border-radius: 7px; overflow: hidden; background-color: rgba(0,0,0,0.3); margin-bottom: 15px; border: 1px solid var(--border-color); }
        .progress-segment { height: 100%; transition: width 0.5s ease; box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }
        .total-pool { text-align: right; font-size: 1em; color: var(--text-muted); font-weight: 400; }
        .total-pool span { color: var(--text-color); font-weight: 600; }
        
        #add-person-panel { display: none; background: var(--card-bg); padding: 30px; margin: 40px auto; border-radius: 20px; border: 1px solid var(--border-color); max-width: 500px; backdrop-filter: blur(12px); }
        .admin-mode #add-person-panel { display: block; }
        .card-admin-actions { position: absolute; top: 15px; right: 15px; display: none; gap: 10px; z-index: 5; }
        .admin-mode .card-admin-actions { display: flex; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.visible { opacity: 1; pointer-events: all; }
        .modal { background: #1f222e; padding: 30px; border-radius: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary-color); width: 90%; max-width: 420px; text-align: center; transform: scale(0.95); transition: transform 0.3s ease; box-shadow: 0 10px 50px rgba(0,0,0,0.4); }
        .modal-input { width: 100%; padding: 18px; font-size: 1.4em; text-align: center; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 12px; font-family: var(--font-family); margin-bottom: 15px; }
        .quick-bet-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .quick-bet-btn { flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: var(--text-muted); font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        
        #loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .loader-spinner { border: 5px solid var(--border-color); border-top: 5px solid var(--primary-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1001; }
        .toast { padding: 15px 25px; border-radius: 12px; color: white; font-weight: 600; background: #2e303e; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: toast-in 0.3s ease, toast-out 0.3s ease 3.7s forwards; }
        
        @media (max-width: 768px) { .bet-layout { flex-direction: column; } .main-bets-column { border-right: none; padding-right: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 25px; } }
        @keyframes card-enter { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes toast-in { from { transform: translateX(calc(100% + 20px)); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toast-out { from { transform: translateX(0); opacity: 1; } to { transform: translateX(calc(100% + 20px)); opacity: 0; } }
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <div class="user-profile">
            <div class="user-info"><i class="fas fa-user-circle"></i><span id="user-nickname"></span></div>
            <div class="wallet-display"><i class="fas fa-wallet"></i><span id="wallet-balance"></span> PLN</div>
        </div>
        <h1>RonimSTS</h1>
    </header>

    <main class="container">
        <section class="featured-bets" id="featured-bets"></section>
        <div id="add-person-panel"></div>
        <h2 class="section-header" id="betting-list-header" style="display:none;"></h2>
        <div id="betting-list"></div>
    </main>
    
    <div id="loader-overlay"></div>
    <div id="user-modal-overlay" class="modal-overlay"></div>
    <div id="bet-modal-overlay" class="modal-overlay"></div>
    <div id="toast-container"></div>

    <script>
        const CONFIG = {
            API_URL: 'https://api.jsonbin.io/v3/b/684726828a456b7966ab6bc7',
            API_KEY: '$2a$10$T3nkKRACm80x5BL9/RR/D.btKlIEXaG6NDod8aDskPkob2OuszNrO',
            ADMIN_KEY: 'ronim',
            INITIAL_WALLET_BALANCE: 1000,
            LOCAL_STORAGE_KEY: 'ronim_sts_final_profile_v2',
            PASSING_THRESHOLD: 75,
            BASE_STAKE: 50, // Wirtualna stawka "domu" dla stabilizacji kursów
            BET_RANGES: {
                'range_0_50':   { label: '0-50%',   color: '#ff793f' },
                'range_51_75':  { label: '51-75%',  color: '#ffc82c' },
                'range_76_90':  { label: '76-90%',  color: '#34d399' },
                'range_91_100': { label: '91-100%', color: '#00e0a0' },
            }
        };
        
        let state = { people: [] };
        let user = { id: null, nickname: null, wallet: 0 };
        let currentBet = { personId: null, betId: null, betType: null };
        
        const $ = selector => document.querySelector(selector);
        
        const ui = {
            init() { this.injectTemplates(); this.addEventListeners(); },
            injectTemplates() {
                $('#loader-overlay').innerHTML = `<div class="loader-spinner"></div>`;
                $('#user-modal-overlay').innerHTML = `<div class="modal"><h3>Witaj!</h3><p>Podaj swój pseudonim, aby założyć portfel.</p><input type="text" id="nickname-input" class="modal-input" placeholder="Twój nick" maxlength="20"><div class="modal-actions"><button id="confirm-nickname-btn" class="bet-button">Zaczynajmy!</button></div></div>`;
                $('#bet-modal-overlay').innerHTML = `<div class="modal"><h3 id="modal-title"></h3><p id="modal-subtitle" style="color: var(--text-muted); margin-bottom: 10px;"></p><p id="modal-wallet-info" style="margin-bottom: 20px; font-weight: 300;"></p><input type="text" inputmode="numeric" pattern="[0-9]*" id="modal-bet-amount" class="modal-input" placeholder="0"><div class="quick-bet-buttons"><button class="quick-bet-btn" data-action="setBetAmount" data-amount="10">+10</button><button class="quick-bet-btn" data-action="setBetAmount" data-amount="50">+50</button><button class="quick-bet-btn" data-action="setBetAmount" data-amount="100">+100</button><button class="quick-bet-btn" data-action="setBetAmount" data-amount="max">MAX</button></div><div class="modal-actions" style="display: flex; gap: 15px;"><button class="bet-button" data-action="closeModal" style="background: var(--error-color); flex-grow: 0.5;">Anuluj</button><button class="bet-button" data-action="confirmBet" style="flex-grow: 1;">Zatwierdź</button></div></div>`;
                $('#featured-bets').innerHTML = `<h2 class="section-header">Top Zakłady</h2><div class="featured-grid"></div>`;
                $('#add-person-panel').innerHTML = `<h2 class="section-header"><i class="fas fa-user-shield"></i> Panel Administratora</h2><div style="display: flex; gap: 10px;"><input type="text" id="new-person-name" placeholder="Imię i nazwisko" style="flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.2); color: var(--text-color); font-size: 1em; font-family: var(--font-family);"><button data-action="addPerson" style="padding: 12px 20px; border-radius: 8px; border: none; background: var(--primary-color); color: #10121b; font-weight: 600; cursor: pointer;"><i class="fas fa-plus"></i>Dodaj</button></div>`;
            },
            addEventListeners() {
                document.body.addEventListener('click', e => { const target = e.target.closest('[data-action]'); if (target) { e.preventDefault(); if (actions[target.dataset.action]) actions[target.dataset.action](target); } });
                $('#confirm-nickname-btn').addEventListener('click', () => userSystem.create());
                $('#modal-bet-amount').addEventListener('input', e => { let value = e.target.value.replace(/\D/g, ''); const numVal = parseInt(value, 10); if (!isNaN(numVal) && numVal > user.wallet) { value = user.wallet.toString(); } e.target.value = value; });
            },
            showLoader: () => $('#loader-overlay').style.display = 'flex',
            hideLoader: () => $('#loader-overlay').style.display = 'none',
            showBetModal(target) {
                const { id, betId, betType } = target.dataset;
                const person = state.people.find(p => p.id === parseInt(id));
                currentBet = { personId: parseInt(id), betId, betType };
                let subtitle = betType === 'main' ? `Zakład główny: ${betId === 'pass' ? 'Zda' : 'Nie Zda'}` : `Wynik w zakresie: ${CONFIG.BET_RANGES[betId].label}`;
                $('#modal-title').innerText = `Obstawiasz: ${person.name}`;
                $('#modal-subtitle').innerText = subtitle;
                $('#modal-wallet-info').innerText = `Dostępne środki: ${user.wallet} PLN`;
                $('#modal-bet-amount').value = '';
                $('#bet-modal-overlay').classList.add('visible');
                $('#modal-bet-amount').focus();
            },
            closeModal: () => $('#bet-modal-overlay').classList.remove('visible')
        };
        
        const toast = { show(message, type = 'success') { const el = document.createElement('div'); el.className = `toast`; el.style.borderLeft = `4px solid var(--${type}-color)`; el.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-times-circle'}" style="margin-right: 10px; color: var(--${type}-color)"></i> ${message}`; $('#toast-container').appendChild(el); setTimeout(() => el.remove(), 4000); } };

        const userSystem = {
            init() { const saved = localStorage.getItem(CONFIG.LOCAL_STORAGE_KEY); if(saved) { user = JSON.parse(saved); this.updateDisplay(); } else { $('#user-modal-overlay').classList.add('visible'); } },
            create() { const nick = $('#nickname-input').value.trim(); if(!nick) return toast.show('Podaj pseudonim!', 'error'); user = { id: `user_${Date.now()}`, nickname: nick, wallet: CONFIG.INITIAL_WALLET_BALANCE }; localStorage.setItem(CONFIG.LOCAL_STORAGE_KEY, JSON.stringify(user)); $('#user-modal-overlay').classList.remove('visible'); this.updateDisplay(); toast.show(`Witaj, ${nick}!`, 'success'); },
            updateDisplay() { $('#user-nickname').textContent = user.nickname; $('#wallet-balance').textContent = user.wallet; },
            updateWallet(amount) { user.wallet = Math.max(0, user.wallet + amount); localStorage.setItem(CONFIG.LOCAL_STORAGE_KEY, JSON.stringify(user)); this.updateDisplay(); }
        };

        const api = {
            async fetch() {
                ui.showLoader();
                $('#betting-list').innerHTML = `<p style="text-align:center; color: var(--text-muted);">Ładowanie zakładów...</p>`;
                try {
                    const res = await fetch(`${CONFIG.API_URL}/latest`, { headers: { 'X-Master-Key': CONFIG.API_KEY }});
                    if (!res.ok) {
                        if (res.status === 404) { state = {people:[]}; renderer.renderAll(); return; }
                        throw new Error(`Błąd sieci: ${res.status}`);
                    }
                    state = (await res.json()).record || { people: [] };
                    this.sanitizeData();
                    renderer.renderAll();
                } catch (err) {
                    console.error("Błąd pobierania danych:", err);
                    toast.show('Błąd pobierania danych!', 'error');
                } finally {
                    ui.hideLoader();
                }
            },
            async save() {
                ui.showLoader();
                try {
                    await fetch(CONFIG.API_URL, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': CONFIG.API_KEY },
                        body: JSON.stringify(state)
                    });
                } catch (err) {
                    console.error("Błąd zapisu danych:", err);
                    toast.show('Błąd zapisu danych!', 'error');
                } finally {
                    ui.hideLoader();
                }
            },
            sanitizeData() {
                if (!state.people || !Array.isArray(state.people)) state.people = [];
                state.people.forEach(person => actions.initializeBetStructure(person));
            }
        };

        const logic = {
            calculateOdds(person) {
                const margin = 0.90;
                const formatOdd = val => Math.max(1.05, val).toFixed(2);
                const bets = person.bets;
                const baseStake = CONFIG.BASE_STAKE;
                
                let totalDetailedPool = 0;
                Object.keys(CONFIG.BET_RANGES).forEach(rangeId => {
                    totalDetailedPool += (bets[rangeId] || 0) + baseStake;
                });

                let passProbability = 0;
                let failProbability = 0;

                Object.keys(CONFIG.BET_RANGES).forEach(rangeId => {
                    const prob = ((bets[rangeId] || 0) + baseStake) / totalDetailedPool;
                    const rangeThreshold = parseInt(rangeId.split('_')[0], 10) > 0 ? parseInt(rangeId.split('_')[1], 10) : CONFIG.PASSING_THRESHOLD -1;

                    if (rangeThreshold >= CONFIG.PASSING_THRESHOLD) {
                        passProbability += prob;
                    } else {
                        failProbability += prob;
                    }
                });
                
                const mainOdds = {
                    pass: formatOdd((1 / passProbability) * margin),
                    fail: formatOdd((1 / failProbability) * margin)
                };

                const detailedOdds = Object.keys(CONFIG.BET_RANGES).map(rangeId => {
                    const rangeProb = ((bets[rangeId] || 0) + baseStake) / totalDetailedPool;
                    return { rangeId, odd: formatOdd((1 / rangeProb) * margin) };
                });

                const totalPool = Object.values(bets).reduce((a, b) => a + b, 0);
                return { mainOdds, detailedOdds, totalPool };
            }
        };

        const renderer = {
            renderAll() { this.renderFeaturedBets(); this.renderBettingList(); },
            renderFeaturedBets() {
                const grid = $('#featured-bets .featured-grid');
                if (!state.people || state.people.length < 1) return $('#featured-bets').style.display = 'none';
                $('#featured-bets').style.display = 'block';

                const allOdds = state.people.flatMap(p => { const { mainOdds, detailedOdds } = logic.calculateOdds(p); return [ { person: p, label: 'Zda', odd: mainOdds.pass }, { person: p, label: 'Nie zda', odd: mainOdds.fail }, ...detailedOdds.map(o => ({ person: p, label: CONFIG.BET_RANGES[o.rangeId].label, odd: o.odd })) ]; });
                if (allOdds.length === 0) return grid.innerHTML = '';
                
                const minOddBet = allOdds.reduce((min, o) => parseFloat(o.odd) < parseFloat(min.odd) ? o : min, allOdds[0]);
                const maxOddBet = allOdds.reduce((max, o) => parseFloat(o.odd) > parseFloat(max.odd) ? o : max, allOdds[0]);
                const peopleWithPool = state.people.map(p => ({...p, totalPool: logic.calculateOdds(p).totalPool}));
                const hotBet = peopleWithPool.length > 0 ? peopleWithPool.reduce((max, p) => p.totalPool > max.totalPool ? p : max, peopleWithPool[0]) : {name: 'Brak', totalPool: 0};
                
                grid.innerHTML = `<div class="featured-card sure-bet"><div class="featured-content"><div class="featured-title"><i class="icon fas fa-gem"></i>Pewniak</div><div class="featured-person">${minOddBet.person.name}</div><div class="featured-details">${minOddBet.label} @ <strong>${minOddBet.odd}</strong></div></div></div><div class="featured-card risky-bet"><div class="featured-content"><div class="featured-title"><i class="icon fas fa-skull-crossbones"></i>Ryzykant</div><div class="featured-person">${maxOddBet.person.name}</div><div class="featured-details">${maxOddBet.label} @ <strong>${maxOddBet.odd}</strong></div></div></div><div class="featured-card hot-bet"><div class="featured-content"><div class="featured-title"><i class="icon fas fa-fire-flame-curved"></i>Gorący Typ</div><div class="featured-person">${hotBet.name}</div><div class="featured-details">Łączna pula: <strong>${hotBet.totalPool} PLN</strong></div></div></div>`;
            },
            renderBettingList() {
                const list = $('#betting-list');
                const header = $('#betting-list-header');
                list.innerHTML = '';
                if(state.people && state.people.length > 0) {
                    header.textContent = `Zakłady dla ${state.people.length} zawodników`;
                    header.style.display = 'block';
                    state.people.forEach((p, i) => { list.insertAdjacentHTML('beforeend', this.createCardHTML(p, i)); this.updateCardContent(list.lastElementChild, p); });
                } else {
                    header.style.display = 'none';
                    list.innerHTML = `<p style="text-align:center; color: var(--text-muted);">Admin nie dodał jeszcze żadnych zawodników.</p>`;
                }
            },
            createCardHTML(person, index = 0) { return `<div class="person-card" data-person-id="${person.id}" style="animation-delay: ${index * 0.07}s"><div class="card-admin-actions"><button class="admin-card-btn" data-action="reset" data-id="${person.id}" title="Resetuj"><i class="fas fa-sync-alt"></i></button><button class="admin-card-btn" data-action="delete" data-id="${person.id}" title="Usuń"><i class="fas fa-trash-alt"></i></button></div><div class="card-header"><div class="person-name">${person.name}</div></div><div class="card-body"><div class="bet-layout"><div class="main-bets-column"></div><div class="detailed-bets-column"></div></div></div><div class="card-footer"><div class="bet-progress-bar" data-progress-bar-id="${person.id}"></div><div class="total-pool">Łączna pula: <span data-total-pool-id="${person.id}"></span> PLN</div></div></div>`; },
            updateCardContent(card, person) {
                const { mainOdds, detailedOdds, totalPool } = logic.calculateOdds(person);
                card.querySelector('.main-bets-column').innerHTML = `<div class="column-header"><i class="fas fa-star"></i>Zakłady Główne</div><div class="main-bet-option"><div class="bet-label">Zda</div><div class="bet-odd-value">${mainOdds.pass}</div><button class="bet-button" data-action="showBetModal" data-id="${person.id}" data-bet-id="pass" data-bet-type="main">Obstaw</button></div><div class="main-bet-option"><div class="bet-label">Nie Zda</div><div class="bet-odd-value">${mainOdds.fail}</div><button class="bet-button" data-action="showBetModal" data-id="${person.id}" data-bet-id="fail" data-bet-type="main">Obstaw</button></div>`;
                const detailedRowsHTML = detailedOdds.map(({ rangeId, odd }) => `<tr><td class="bet-label">${CONFIG.BET_RANGES[rangeId].label}</td><td class="bet-odd-value">${odd}</td><td><button class="bet-button" data-action="showBetModal" data-id="${person.id}" data-bet-id="${rangeId}" data-bet-type="detailed">Obstaw</button></td></tr>`).join('');
                card.querySelector('.detailed-bets-column').innerHTML = `<div class="column-header"><i class="fas fa-magnifying-glass-chart"></i>Zakłady Szczegółowe</div><table class="bet-table"><tbody>${detailedRowsHTML}</tbody></table>`;
                const progressSegmentsHTML = Object.keys(CONFIG.BET_RANGES).map(rangeId => { const percentage = totalPool > 0 ? ((person.bets[rangeId] || 0) / totalPool) * 100 : 0; return `<div class="progress-segment" style="width: ${percentage}%; background-color: ${CONFIG.BET_RANGES[rangeId].color};" title="${CONFIG.BET_RANGES[rangeId].label}"></div>`; }).join('');
                card.querySelector(`[data-progress-bar-id="${person.id}"]`).innerHTML = progressSegmentsHTML;
                card.querySelector(`[data-total-pool-id="${person.id}"]`).textContent = totalPool;
            }
        };

        const actions = {
            async confirmBet() {
                const input = $('#modal-bet-amount');
                const amount = parseInt(input.value.replace(/\D/g, ''), 10);
                if (isNaN(amount) || amount <= 0) return toast.show("Podaj poprawną kwotę.", 'error');
                if (amount > user.wallet) return toast.show("Nie masz wystarczających środków!", 'error');
                const person = state.people.find(p => p.id === currentBet.personId);
                if (person) {
                    person.bets[currentBet.betId] = (person.bets[currentBet.betId] || 0) + amount;
                    userSystem.updateWallet(-amount);
                    ui.closeModal();
                    await api.save();
                    toast.show(`Postawiono ${amount} PLN!`, 'success');
                    renderer.updateCardContent($(`[data-person-id="${currentBet.personId}"]`), person);
                    renderer.renderFeaturedBets();
                }
            },
            async addPerson() {
                const name = $('#new-person-name').value.trim();
                if (!name) return toast.show("Podaj imię i nazwisko.", 'error');
                let newPerson = { id: Date.now(), name };
                newPerson = this.initializeBetStructure(newPerson);
                state.people.push(newPerson);
                await api.save();
                toast.show(`Dodano "${name}"!`, 'success');
                renderer.renderAll();
                $('#new-person-name').value = '';
            },
            async delete(target) { const personId = parseInt(target.dataset.id); const person = state.people.find(p => p.id === personId); if (confirm(`Czy na pewno chcesz usunąć ${person.name}?`)) { state.people = state.people.filter(p => p.id !== personId); await api.save(); toast.show(`${person.name} usunięty.`, 'success'); renderer.renderAll(); } },
            async reset(target) { const personId = parseInt(target.dataset.id); const person = state.people.find(p => p.id === personId); if (confirm(`Czy chcesz zresetować zakłady dla ${person.name}?`)) { person = this.initializeBetStructure(person); await api.save(); toast.show(`Zakłady dla ${person.name} zresetowane.`, 'success'); renderer.updateCardContent($(`[data-person-id="${personId}"]`), person); renderer.renderFeaturedBets(); } },
            setBetAmount(target) {
                const input = $('#modal-bet-amount');
                const amount = target.dataset.amount;
                if (amount === 'max') { input.value = user.wallet; } else { const currentVal = parseInt(input.value) || 0; input.value = Math.min(user.wallet, currentVal + parseInt(amount)); }
            },
            initializeBetStructure(person) {
                if (!person.bets) person.bets = {};
                const allBetKeys = ['pass', 'fail', ...Object.keys(CONFIG.BET_RANGES)];
                allBetKeys.forEach(key => { person.bets[key] = 0; });
                return person;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            ui.init();
            userSystem.init();
            if (new URLSearchParams(window.location.search).get('admin') === CONFIG.ADMIN_KEY) {
                document.body.classList.add('admin-mode');
            }
            api.fetch();
        });
    </script>
</body>
</html>
