<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasowy Typer Egzaminacyjny</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --background-color: #1a1a2e;
            --surface-color: #16213e;
            --text-color: #e3e3e3;
            --accent-color: #f7b733;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --neutral-color: #95a5a6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--surface-color);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2em;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        #user-balance {
            background-color: var(--accent-color);
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1em;
            box-shadow: 0 0 15px rgba(247, 183, 51, 0.5);
        }
        
        #admin-panel {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: none; /* Ukryty domyślnie */
        }
        
        #admin-panel h2 {
            margin-bottom: 15px;
            text-align: center;
            color: var(--accent-color);
        }

        .form-container {
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text-color);
        }
        .input-field::placeholder { color: rgba(255, 255, 255, 0.5); }
        .input-field:focus { outline: none; border-color: var(--accent-color); }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #1a1a2e;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(247, 183, 51, 0.4);
        }

        .student-list { list-style: none; }

        .student-item {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-left: 5px solid var(--neutral-color);
        }
        .student-item.status-zda { border-left-color: var(--success-color); }
        .student-item.status-nie-zda { border-left-color: var(--danger-color); }

        .student-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .student-name { font-size: 1.4em; font-weight: 600; }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            color: #fff;
        }
        .status-badge.official-result { font-size: 1em; }
        .status-badge.result-pass { background-color: var(--success-color); }
        .status-badge.result-fail { background-color: var(--danger-color); }
        .status-badge.bet-pending { background-color: var(--accent-color); color: #1a1a2e; }
        .status-badge.bet-won { background: linear-gradient(45deg, #00b09b, #96c93d); }
        .status-badge.bet-lost { background: linear-gradient(45deg, #ff512f, #dd2476); }
        .status-badge.bet-open { background-color: var(--neutral-color); }

        .actions-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .betting-controls { display: flex; gap: 10px; align-items: center; }
        .bet-input {
            width: 80px;
            padding: 8px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-color);
            border-radius: 5px;
        }

        .bet-btn { padding: 8px 12px; font-size: 14px; border-radius: 5px; }
        .btn-pass { background-color: var(--success-color); color: white; }
        .btn-fail { background-color: var(--danger-color); color: white; }
        .btn-pass:hover { background-color: #27ae60; }
        .btn-fail:hover { background-color: #c0392b; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .admin-controls { display: flex; gap: 10px; }
        .admin-btn { background-color: transparent; border: 1px solid var(--neutral-color); color: var(--neutral-color); padding: 8px 12px; font-size: 14px; }
        .admin-btn:hover { background-color: var(--neutral-color); color: var(--surface-color); }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            .student-info, .actions-container { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Klasowy Typer 🏆</h1>
            <div id="user-balance">Saldo: 1000 🪙</div>
        </header>

        <div id="admin-panel">
            <h2>Panel Administratora</h2>
            <div class="form-container">
                <input type="text" id="student-name-input" class="input-field" placeholder="Imię i nazwisko nowego ucznia...">
                <button id="add-student-button" class="btn btn-primary">Dodaj</button>
            </div>
        </div>

        <ul id="student-list" class="student-list">
            <!-- Lista uczniów generowana przez JavaScript -->
        </ul>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // === KONFIGURACJA ===
    const ADMIN_KEY = 'admin123'; // Zmień ten klucz na swój własny!
    const STARTING_BALANCE = 1000;
    const PAYOUT_MULTIPLIER = 2;

    const STORAGE_KEYS = {
        STUDENTS: 'classExamStudents_v2',
        BETS: 'classExamUserBets_v2',
        BALANCE: 'classExamUserBalance_v2'
    };

    // === ELEMENTY DOM ===
    const studentNameInput = document.getElementById('student-name-input');
    const adminPanel = document.getElementById('admin-panel');
    const studentListContainer = document.getElementById('student-list');
    const userBalanceDisplay = document.getElementById('user-balance');
    const mainContainer = document.querySelector('.container');

    // === STAN APLIKACJI ===
    let students = [];
    let userBets = {}; // { studentId: { choice: 'Zda'/'Nie zda', amount: 50, paid: false } }
    let userBalance = STARTING_BALANCE;
    let isAdmin = false;

    // === FUNKCJE GŁÓWNE ===

    const checkAdminMode = () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('key') === ADMIN_KEY) {
            isAdmin = true;
            adminPanel.style.display = 'block';
        }
    };

    const loadState = () => {
        const storedStudents = localStorage.getItem(STORAGE_KEYS.STUDENTS);
        const storedBets = localStorage.getItem(STORAGE_KEYS.BETS);
        const storedBalance = localStorage.getItem(STORAGE_KEYS.BALANCE);

        students = storedStudents ? JSON.parse(storedStudents) : [];
        userBets = storedBets ? JSON.parse(storedBets) : {};
        userBalance = storedBalance ? parseFloat(storedBalance) : STARTING_BALANCE;
    };
    
    const saveState = () => {
        // Zapisujemy tylko studentów, jeśli jesteśmy adminem, aby uniknąć nadpisania przez zwykłych userów
        if (isAdmin) {
            localStorage.setItem(STORAGE_KEYS.STUDENTS, JSON.stringify(students));
        }
        localStorage.setItem(STORAGE_KEYS.BETS, JSON.stringify(userBets));
        localStorage.setItem(STORAGE_KEYS.BALANCE, userBalance.toString());
    };

    const checkResolvedBets = () => {
        let balanceChanged = false;
        students.forEach(student => {
            const bet = userBets[student.id];
            // Sprawdź, czy jest zakład, czy nie został jeszcze rozliczony i czy jest już oficjalny wynik
            if (bet && !bet.paid && student.status.startsWith('Wynik')) {
                const officialResult = student.status.includes('Zdał') ? 'Zda' : 'Nie zda';
                if (bet.choice === officialResult) {
                    // Wygrana
                    userBalance += bet.amount * PAYOUT_MULTIPLIER;
                    bet.status = 'won';
                } else {
                    // Przegrana
                    bet.status = 'lost';
                }
                bet.paid = true;
                balanceChanged = true;
            }
        });

        if (balanceChanged) {
            saveState();
        }
    };

    const render = () => {
        userBalanceDisplay.innerHTML = `Saldo: ${Math.round(userBalance)} 🪙`;
        studentListContainer.innerHTML = '';

        if (students.length === 0) {
            studentListContainer.innerHTML = '<li>Lista jest pusta. Administrator musi dodać uczniów.</li>';
            return;
        }

        students.forEach(student => {
            const li = document.createElement('li');
            const userBet = userBets[student.id];

            // Określenie statusu do stylizacji obramowania
            let itemStatusClass = '';
            if (student.status.startsWith('Wynik: Zdał')) itemStatusClass = 'status-zda';
            if (student.status.startsWith('Wynik: Nie zdał')) itemStatusClass = 'status-nie-zda';
            li.className = `student-item ${itemStatusClass}`;
            
            // Generowanie HTML dla statusu
            let statusHTML = '';
            if (student.status.startsWith('Wynik')) {
                const resultClass = student.status.includes('Zdał') ? 'result-pass' : 'result-fail';
                statusHTML = `<span class="status-badge official-result ${resultClass}">${student.status}</span>`;
            } else if (userBet) {
                let betStatusClass = '';
                let betText = `Obstawiono: ${userBet.amount} na "${userBet.choice}"`;
                if(userBet.status === 'won') {
                    betStatusClass = 'bet-won';
                    betText = `Wygrana! +${userBet.amount * PAYOUT_MULTIPLIER} 🪙`;
                } else if (userBet.status === 'lost') {
                    betStatusClass = 'bet-lost';
                    betText = `Przegrana -${userBet.amount} 🪙`;
                } else {
                    betStatusClass = 'bet-pending';
                }
                statusHTML = `<span class="status-badge ${betStatusClass}">${betText}</span>`;
            } else {
                statusHTML = `<span class="status-badge bet-open">Otwarty do obstawiania</span>`;
            }

            // Generowanie HTML dla kontrolek akcji
            let actionsHTML = '';
            const isResolved = student.status.startsWith('Wynik');
            
            // Kontrolki dla użytkownika
            if (!userBet && !isResolved) {
                actionsHTML = `
                    <div class="betting-controls">
                        <input type="number" class="bet-input" placeholder="Stawka" min="1" step="1" id="bet-amount-${student.id}">
                        <button class="btn bet-btn btn-pass" data-action="bet-pass" data-id="${student.id}">Obstaw Zda</button>
                        <button class="btn bet-btn btn-fail" data-action="bet-fail" data-id="${student.id}">Obstaw Nie Zda</button>
                    </div>
                `;
            }
            
            // Kontrolki dla admina
            let adminControlsHTML = '';
            if (isAdmin) {
                adminControlsHTML = `
                    <div class="admin-controls">
                        ${!isResolved ? `
                        <button class="btn admin-btn" data-action="resolve-pass" data-id="${student.id}">✔️ Rozstrzygnij: Zdał</button>
                        <button class="btn admin-btn" data-action="resolve-fail" data-id="${student.id}">❌ Rozstrzygnij: Nie zdał</button>
                        ` : ''}
                        <button class="btn admin-btn" data-action="delete-student" data-id="${student.id}">🗑️ Usuń</button>
                    </div>
                `;
            }

            li.innerHTML = `
                <div class="student-info">
                    <span class="student-name">${student.name}</span>
                    ${statusHTML}
                </div>
                <div class="actions-container">
                    ${actionsHTML}
                    ${adminControlsHTML}
                </div>
            `;
            studentListContainer.appendChild(li);
        });
    };

    // === FUNKCJE OBSŁUGUJĄCE AKCJE ===

    const addStudent = () => {
        const name = studentNameInput.value.trim();
        if (name === '') {
            alert('Wpisz imię i nazwisko!');
            return;
        }
        students.push({
            id: Date.now(),
            name: name,
            status: 'Nieobstawione' // 'Nieobstawione', 'Wynik: Zdał', 'Wynik: Nie zdał'
        });
        studentNameInput.value = '';
        saveState();
        render();
    };

    const placeBet = (studentId, choice) => {
        const amountInput = document.getElementById(`bet-amount-${studentId}`);
        const amount = parseFloat(amountInput.value);

        if (isNaN(amount) || amount <= 0) {
            alert('Proszę podać poprawną, dodatnią stawkę.');
            return;
        }
        if (amount > userBalance) {
            alert('Nie masz wystarczających środków!');
            return;
        }
        if (userBets[studentId]) {
            alert('Już obstawiłeś wynik dla tego ucznia!');
            return;
        }

        userBalance -= amount;
        userBets[studentId] = { choice, amount, paid: false };
        
        saveState();
        render();
    };
    
    const resolveStudent = (studentId, result) => {
        const student = students.find(s => s.id === studentId);
        if (student && confirm(`Czy na pewno chcesz rozstrzygnąć zakład dla "${student.name}" jako "${result}"?`)) {
            student.status = result;
            saveState();
            // Po rozstrzygnięciu, musimy ponownie sprawdzić zakłady i przeliczyć saldo.
            checkResolvedBets(); 
            render();
        }
    };

    const deleteStudent = (studentId) => {
         const student = students.find(s => s.id === studentId);
         if (student && confirm(`Czy na pewno usunąć "${student.name}" z listy? Tej akcji nie można cofnąć.`)) {
            students = students.filter(s => s.id !== studentId);
            // Można też usunąć powiązane zakłady, ale dla uproszczenia zostawiamy
            saveState();
            render();
         }
    };


    // === OBSŁUGA ZDARZEŃ ===
    mainContainer.addEventListener('click', (e) => {
        const action = e.target.dataset.action;
        const id = parseInt(e.target.dataset.id);

        if (!action) return;

        switch (action) {
            case 'bet-pass':
                placeBet(id, 'Zda');
                break;
            case 'bet-fail':
                placeBet(id, 'Nie zda');
                break;
            case 'resolve-pass':
                resolveStudent(id, 'Wynik: Zdał');
                break;
            case 'resolve-fail':
                resolveStudent(id, 'Wynik: Nie zdał');
                break;
            case 'delete-student':
                deleteStudent(id);
                break;
        }
    });

    if (adminPanel.style.display === 'block') { // Tylko jeśli jesteśmy adminem
        document.getElementById('add-student-button').addEventListener('click', addStudent);
        studentNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addStudent();
        });
    }

    // === INICJALIZACJA ===
    checkAdminMode();
    loadState();
    checkResolvedBets(); // Sprawdź rozliczenia przy każdym załadowaniu strony
    render();
});
</script>

</body>
</html>
